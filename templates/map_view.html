{% extends 'layout.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cville Scout | Interactive Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="../static/css/style.css">
    
    <style>
        .user-panel { padding: 15px 25px; border-bottom: 1px solid #eee; background: #fafafa; }
        .discovery-tool { padding: 20px 25px; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip { padding: 6px 14px; border: 1.5px solid #232d4b; border-radius: 20px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .chip.active { background: #232d4b; color: white; }
        #map { flex-grow: 1; height: 100vh; }
    </style>
</head>
<body>

    <div class="app-container" style="display: flex;">
        <aside class="sidebar" style="width: 350px; height: 100vh; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000;">
            <div class="sidebar-header" style="background: #232d4b; color: white; padding: 25px;">
                <h1 style="margin: 0;">Cville Scout</h1>
            </div>

            <div class="user-panel">
                <small>Logged in as:</small>
                <div id="display-name" style="font-weight: bold; color: #232d4b;">Cville Scout (Test)</div>
                <a href="login.html" style="font-size: 11px; color: #e57200; text-decoration: none;">Sign Out</a>
            </div>

            <div class="discovery-tool">
                <label><strong>Max Budget:</strong> <span id="priceLabel">$50</span></label>
                <input type="range" style="width: 100%; margin: 10px 0;" min="0" max="100" value="50" oninput="document.getElementById('priceLabel').innerText = '$' + this.value">
                
                <p style="margin-top: 15px; margin-bottom: 5px;"><strong>Interests:</strong></p>
                <div class="chip-container">
                    <div class="chip active">🍔 Food</div>
                    <div class="chip">🌲 Hiking</div>
                    <div class="chip">💪 Gyms</div>
                    <div class="chip">📚 History</div>
                </div>

                <button class="filter-btn" style="width: 100%; background: #e57200; color: white; border: none; padding: 12px; border-radius: 6px; margin-top: 20px; cursor: pointer; font-weight: bold;">
                    Update Recommendations
                </button>
            </div>

            <div id="location-list" style="overflow-y: auto; flex-grow: 1; padding: 10px;"></div>
        </aside>

        <main id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="../static/js/map.js"></script>
</body>
</html>
