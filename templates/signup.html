{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="auth-wrapper" style="display: flex; justify-content: center; align-items: center; height: 80vh;">
    <div class="auth-card" style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center;">
        <h2 style="color: #232d4b;">Create Account</h2>
        <p style="color: #666; margin-bottom: 20px;">Join the Cville Scout community.</p>
        
        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            <input type="text" name="first_name" class="auth-input" placeholder="First Name" required style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;">
            <input type="text" name="last_name" class="auth-input" placeholder="Last Name" required style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;">
            <input type="email" name="email" class="auth-input" placeholder="Email Address" required style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;">
            <input type="password" name="password" class="auth-input" placeholder="Create Password" required style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;">
            
            <button type="submit" class="auth-btn" style="background: #232d4b; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;">Sign Up</button>
        </form>
    </div>
</div>
{% endblock %}
