{% extends 'layout.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Cville Scout</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        .auth-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 380px; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .login-btn { background: #e57200; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .login-btn:hover { background: #c46200; }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 style="color: #232d4b;">Welcome Back</h2>
            <p style="color: #666; margin-bottom: 25px;">Ready to explore Cville?</p>
            
            <form>
                <input type="email" class="auth-input" placeholder="Email Address" required>
                <input type="password" class="auth-input" placeholder="Password" required>
                
                <button type="button" class="login-btn" onclick="window.location.href='/map'">Login</button>
            </form>

            <p style="margin-top: 20px; font-size: 13px;">
                New scout? <a href="/signup" style="color: #232d4b; font-weight: bold;">Create an Account</a>
            </p>
        </div>
    </div>
</body>
</html>
